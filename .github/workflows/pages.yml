name: HP67 Studio - Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: hp67-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate V2 app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Check JavaScript syntax
        run: node --check app-v2.js
      - name: Validate HTML/CSS/JS wiring
        run: python3 scripts/validate.py
      - name: Verify pinned browser dependencies
        run: |
          grep -q 'jszip@3.10.2' index.html
          grep -q 'heic2any@0.0.4' index.html
          grep -q 'pako@1.0.11' index.html
          grep -q 'utif@3.1.0/UTIF.js' index.html
          grep -q 'unpkg.com/jszip@3.10.2' index.html
          grep -q 'unpkg.com/heic2any@0.0.4' index.html
          grep -q 'unpkg.com/pako@1.0.11' index.html
          grep -q 'unpkg.com/utif@3.1.0/UTIF.js' index.html
      - name: Static server smoke test
        run: |
          python3 -m http.server 8080 >/tmp/hp67-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/app-v2.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/styles.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/manifest.webmanifest >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/sw.js >/dev/null

  package:
    name: Build downloadable website
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Prepare website package
        run: |
          mkdir -p hp67-studio-site
          cp index.html app-v2.js styles.css manifest.webmanifest sw.js README.md hp67-studio-site/
          touch hp67-studio-site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HP67-Image-Studio-V2
          path: hp67-studio-site
          retention-days: 30

  pages_status:
    name: Check GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Detect whether Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl --silent --show-error \
            --output /tmp/pages.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$STATUS" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled (HTTP $STATUS). Validation/package still succeed."
          fi

  build_pages:
    name: Build Pages artifact
    if: github.event_name != 'pull_request' && needs.pages_status.outputs.enabled == 'true'
    needs: [validate, pages_status]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app-v2.js styles.css manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && needs.pages_status.outputs.enabled == 'true'
    needs: [pages_status, build_pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
