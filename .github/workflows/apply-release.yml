name: HP67 Apply Reliability Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply and verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Apply atomic release payload
        run: python3 scripts/apply_release.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate HTML/CSS/JS wiring
        run: python3 scripts/validate.py
      - name: Static server smoke test
        run: |
          python3 -m http.server 8080 >/tmp/hp67-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/app.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/styles.css >/dev/null
      - name: Build verified site artifact
        run: |
          mkdir -p hp67-upscale-site
          cp index.html app.js styles.css hp67-upscale-site/
          touch hp67-upscale-site/.nojekyll
      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: HP67-Upscale-Verified
          path: hp67-upscale-site
          retention-days: 30
      - name: Commit verified release
        run: |
          rm -rf hp67-upscale-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Apply HP67 reliability fixes"
          git push origin HEAD:main
