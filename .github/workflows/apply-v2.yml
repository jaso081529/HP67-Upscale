name: HP67 Apply Studio V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    name: Apply and verify Studio V2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Verify and apply V2 payload
        run: python3 scripts/apply_v2.py
      - name: Check JavaScript syntax
        run: node --check app-v2.js
      - name: Validate HTML/CSS/JS wiring
        run: python3 scripts/validate.py
      - name: Static server smoke test
        run: |
          python3 -m http.server 8080 >/tmp/hp67-v2-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8080/index.html >/dev/null
          curl -fsS http://127.0.0.1:8080/app-v2.js >/dev/null
          curl -fsS http://127.0.0.1:8080/styles.css >/dev/null
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest >/dev/null
          curl -fsS http://127.0.0.1:8080/sw.js >/dev/null
      - name: Commit verified V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V2 changes to commit."
            exit 0
          fi
          git commit -m "Deploy HP67 Image Studio V2"
          git push origin HEAD:main
